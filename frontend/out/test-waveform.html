<!DOCTYPE html>
<html>
<head>
  <title>Waveform Test</title>
</head>
<body>
  <h1>Waveform Test</h1>
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop</button>
  <div>
    <canvas id="canvas" width="800" height="200" style="border:1px solid #ccc; width:100%;"></canvas>
  </div>
  <div id="status">Ready</div>

  <script>
    let audioContext, analyser, dataArray, mediaRecorder;
    let isRecording = false;
    let animationId = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    function drawWaveform() {
      if (!isRecording) return;

      analyser.getByteTimeDomainData(dataArray);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 2;
      ctx.strokeStyle = '#3b82f6';
      ctx.beginPath();

      const sliceWidth = canvas.width / dataArray.length;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      ctx.stroke();
      animationId = requestAnimationFrame(drawWaveform);
    }

    document.getElementById('startBtn').onclick = async () => {
      try {
        status.textContent = 'Requesting microphone...';
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        status.textContent = 'Microphone granted!';

        // Audio context
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        status.textContent = 'AudioContext state: ' + audioContext.state;

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);

        // MediaRecorder (just to keep the stream alive)
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.start();

        isRecording = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        status.textContent = 'Recording... Waveform should appear!';

        drawWaveform();
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        console.error(err);
      }
    };

    document.getElementById('stopBtn').onclick = () => {
      isRecording = false;
      if (animationId) cancelAnimationFrame(animationId);
      if (mediaRecorder) mediaRecorder.stop();
      if (audioContext) audioContext.close();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      status.textContent = 'Stopped';
    };
  </script>
</body>
</html>
